services:
  app:
    build: ./backend
    container_name: techconet57-app
    restart: unless-stopped
    env_file: .env
    volumes:
      - app_data:/app/data
    expose:
      - "3000"

  nginx:
    image: nginx:1.27-alpine
    container_name: techconet57-nginx
    restart: unless-stopped
    depends_on:
      - app
    ports:
      - "80:80"
    volumes:
      - ./frontend:/usr/share/nginx/html:ro
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro

volumes:
  app_data:
